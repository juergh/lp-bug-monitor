name: "LP Bug Monitor Sync"

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tools
        uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Set up uv
        uses: astral-sh/setup-uv@v5  # on Gihub
        # uses: actions/setup-uv  # on Forgejo

      - name: Sync
        run: ./lp-bug-monitor -f data/packages.txt --state-file data/bugs-state.json -o data/bugs.html

      - name: Commit and push
        run: |
          cd data
          git config user.name "Github Actions"
          git config user.email "noreply+github-actions@github.com"
          # git config user.name "Forgejo Actions"
          # git config user.email "noreply+forgejo-actions@canonical.com"
          git add bugs.html bugs-state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin data
